<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ジム記録">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ジム記録</title>
<style>
  :root{ --bg:#0f172a; --card:#1e293b; --line:#334155; --tx:#e2e8f0; --sub:#94a3b8; --ac:#2dd4bf; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--tx); display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    padding:24px; padding-top:calc(24px + env(safe-area-inset-top));
  }
  .box{ width:100%; max-width:340px; text-align:center; }
  h1{ font-size:1.15rem; margin:0 0 4px; letter-spacing:.02em; }
  .sub{ font-size:.8rem; color:var(--sub); margin:0 0 22px; }
  input[type=password]{
    width:100%; padding:14px 16px; font-size:1.05rem; text-align:center;
    background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:12px;
    -webkit-appearance:none; margin-bottom:12px;
  }
  input[type=password]:focus{ outline:none; border-color:var(--ac); }
  button{
    width:100%; padding:14px; font-size:1rem; font-weight:700;
    background:var(--ac); color:#0f172a; border:0; border-radius:12px; -webkit-appearance:none;
  }
  button:disabled{ opacity:.5; }
  .remember{ display:flex; align-items:center; justify-content:center; gap:8px; margin:14px 0 0; font-size:.82rem; color:var(--sub); }
  .remember input{ width:18px; height:18px; accent-color:var(--ac); }
  .msg{ min-height:1.2em; margin-top:14px; font-size:.85rem; color:#f87171; }
  .msg.work{ color:var(--sub); }
</style>
</head>
<body>
<div class="box" id="box">
  <h1>ジム記録</h1>
  <p class="sub">パスワードを入れると開きます</p>
  <form id="f">
    <input type="password" id="pw" autocomplete="current-password" enterkeyhint="go" autofocus>
    <button type="submit" id="go">開く</button>
  </form>
  <label class="remember"><input type="checkbox" id="rem" checked>この端末では次回から自動で開く</label>
  <p class="msg" id="msg"></p>
</div>

const ITER = 310000, SALT_LEN = 16, IV_LEN = 12;
const REM_KEY = 'gymlog_pw_v1';

function b64ToBytes(b64){
  const bin = atob(b64); const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function decrypt(pw){
  const raw = b64ToBytes(PAYLOAD);
  const salt = raw.slice(0, SALT_LEN);
  const iv   = raw.slice(SALT_LEN, SALT_LEN + IV_LEN);
  const data = raw.slice(SALT_LEN + IV_LEN);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(buf);
}

/* 復号したHTMLでページを丸ごと差し替える。
   document.write なら中の <script> がそのまま同期実行されるので、本体アプリの初期化がそのまま走る。 */
function render(html){
  document.open();
  document.write(html);
  document.close();
}

const msg = document.getElementById('msg');
const go  = document.getElementById('go');

async function tryOpen(pw, remember){
  msg.className = 'msg work'; msg.textContent = '開いています…';
  go.disabled = true;
  try{
    const html = await decrypt(pw);
    if(remember){ try{ localStorage.setItem(REM_KEY, pw); }catch(e){} }
    render(html);
    return true;
  }catch(e){
    try{ localStorage.removeItem(REM_KEY); }catch(e2){}
    msg.className = 'msg'; msg.textContent = 'パスワードが違います';
    go.disabled = false;
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
    return false;
  }
}

document.getElementById('f').addEventListener('submit', e=>{
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if(!pw) return;
  tryOpen(pw, document.getElementById('rem').checked);
});

/* 2回目以降は保存したパスワードで自動的に開く（プライベートブラウズや初回は手入力） */
(async ()=>{
  let saved = null;
  try{ saved = localStorage.getItem(REM_KEY); }catch(e){}
  if(saved){
    msg.className = 'msg work'; msg.textContent = '開いています…';
    await tryOpen(saved, true);
  }
})();
</script>
